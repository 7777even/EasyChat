name: CI

# 与本地 scripts/ 门禁同款，main 推送与 PR 自动执行。
# 与本地 Git hooks 的分工：hooks 管提交与推送前的快速拦截，CI 是权威判定。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端编译与单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-${{ hashFiles('easychat-java/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      # 2026-10-03：temurin 8 → 17，与 pom 的 java.version=17 及 Dockerfile 对齐。
      # 先前本机 JDK 17 / CI JDK 8 长期漂移，导致「本地全绿」无法推断「CI 全绿」。
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: easychat-java/pom.xml

      - name: mvn test（单测）
        working-directory: easychat-java
        run: mvn -B test

      - name: mvn package（构建产物）
        working-directory: easychat-java
        run: mvn -B package -DskipTests

      - name: 校验构建产物存在
        run: test -f easychat-java/target/easychat-1.0.jar

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: easychat-front/package-lock.json

      - name: npm ci
        working-directory: easychat-front
        run: npm ci

      # 2026-10-04 恢复前端 lint 闸门。
      # 此前刻意移除，理由是「脚本在改动前即已失效」——但真因不是 lint 恒红，
      # 而是**原 `lint` 脚本自带 `--fix`**：任何人（包括 AI）为「看一眼有没有问题」
      # 而执行它，都会重排全部源文件。实测两次分别改动 50 个文件（+4458 / −3524 行）
      # 与 45 个文件，含 Emoji.js / Request.js / cloudBackup.js 等与检查目的无关的文件。
      #
      # 第二次事故性质更糟：**当时正在改 `lint` 脚本本身**，改写工具因扩展名不匹配而
      # 失败、脚本仍是 --fix 版本，于是「执行以验证改动生效」这一步直接格式化 45 个文件。
      # 即：在修改有副作用的工具时执行它，等于触发它的副作用。
      #
      # 现已拆分为 `lint`（只查，exit 0）与 `lint:fix`（才改），且错误数已清零。
      # 6 千余个 prettier 排版 warning 已降级为 warn 不阻断（全仓格式化会重排
      # 48 个文件，噪声压过价值；需格式化时应作独立提交）。
      # 断言脚本：node scripts/verify/verify_frontend_lint.mjs
      # 回归条件：若 lint 又出现 error，说明引入了新问题，门禁会拦下。

      - name: 前端 lint
        working-directory: easychat-front
        run: npm run lint

      - name: 组件测试
        working-directory: easychat-front
        run: npm run test

  gates:
    name: 契约与规范门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 前后端接口契约一致性
        run: node scripts/check-api-contract.mjs --strict

      - name: IPC 通道注册完整性
        run: node scripts/check-ipc-registration.mjs --strict

      - name: OpenSpec 规格卫生（四件套 / 归档闭环）
        run: node scripts/check-openspec-hygiene.mjs

      - name: Mapper @Param 与 XML 占位符一致性
        run: node scripts/verify/verify_mapper_params.mjs

      - name: 密码明文交接红线
        run: node scripts/verify/verify_password_handoff.mjs

      - name: 运行时配置分层与硬编码凭据
        run: node scripts/verify/verify_no_hardcoded_secret.mjs

      # 2026-10-02 新增。首次运行即抓出位置消息(25)/语音消息(24)端到端未接通：
      # 服务端直推但客户端无 case → 对端实时收不到，且不崩不报错。
      # 详见 scripts/README.md「WS 帧协议对账」。
      - name: WebSocket 帧协议两端对账
        run: node scripts/verify/verify_ws_frame_parity.mjs

      # 2026-10-03 新增。接语音消息时发现 file.js 的 MIME 映射表缺 fileType=3
      # → content-type 拼成 "undefinedwebm"，浏览器无法解码、<audio> 静默无声。
      # 这类缺陷不在 HTTP 请求流里，ws_frame_parity 照不到，属独立一层。
      - name: 本地文件服务器 fileType 与 content-type 一致性
        run: node scripts/verify/verify_file_type_content_type.mjs

      # 2026-10-03 新增。首次运行即抓出三处认证面缺陷：
      # ① 改密 / 找回密码成功后既不清 Token 也不推 FORCE_OFF_LINE（改密无法踢出攻击者）
      # ② 邮箱验证码明文写日志（日志读权限 = 任意账号改密权限）
      # ③ checkRateLimit 在 token 为 null 时直接 return → 四个未登录端点限流形同虚设
      # 这三条都不抛异常、不打警告，属静默失效，故固化为机控断言。
      - name: 密码会话失效与验证码投递契约
        run: node scripts/verify/verify_password_session.mjs

      # 2026-10-03 新增。首次运行即报出两类「字段/列早就备好、行为却从未落地」的缺口：
      # ① operation_log.ip_address 恒为 null（6 处 recordLog 调用点全传 null，
      #    最需溯源的 LOGIN_FAILED / FORCE_OFFLINE / UPDATE_PASSWORD 全无 IP）
      # ② @所有人 权限仅在客户端生效（Java 侧 atAll 零命中，普通成员可冒用管理员身份）
      # 两者都不抛异常、不打警告，属静默失效。
      - name: 审计IP补齐与@所有人服务端鉴权契约
        run: node scripts/verify/verify_audit_and_at_all.mjs

      # 2026-10-04 新增。引入 Flyway 后有三处「配错了不报错、只是静默跳过迁移」：
      # ① flyway-core 版本被「顺手」改回随 parent 的 8.0.4 → Community 版不再支持
      #    MySQL 5.7，本机开发库正是 5.7，开发者本地直接起不来
      # ② baseline-version 忘记随新增迁移同步 → 新迁移在存量库被当作已应用而静默跳过
      # ③ 迁移文件里混入 DELIMITER / CREATE PROCEDURE → Flyway 的 MySQL 解析器过不了
      # 三者都不抛异常，属静默失效，故固化为机控断言。
      - name: Flyway 迁移自动化契约
        run: node scripts/verify/verify_migration_flyway.mjs

      - name: 虚拟列表核心算法
        run: node scripts/verify/verify_virtual_core.mjs

      - name: 通话核心逻辑
        run: node scripts/verify/verify_call_core.mjs

      # 2026-10-04 新增。verify_call_core 只覆盖 callFrameCore（帧 → 状态转移），
      # 「store 拿到转移后怎么落地」这段（结束态重置、1800ms 复位守卫、出站报文）
      # 此前是黑箱——它与 Pinia/WebRTC/window 混在 useCallStore.js，node 中无法 import。
      # 抽离纯核心时暴露出两个既有缺陷，本门禁锁定其修复：
      #   ① 1800ms 复位守卫只判 status==='ended'，无通话身份校验 →
      #      「A 结束后 1800ms 内 B 也结束」时 A 的定时器会抹掉 B 的结束态
      #   ② reason 为空时 endReason 保留上一通通话的旧原因 → 新通话失败却显示旧原因
      - name: 通话 store 编排逻辑核心
        run: node scripts/verify/verify_call_store_core.mjs

      # 2026-10-04 新增。db/ADB.js 在模块加载时 require('sqlite3') 并建表，
      # node 中无法 import → 本地缓存层的 SQL 拼装与列映射逻辑完全不可测。
      # 而这一层是「静默失效」高发区：列名拼错 / where 条件漏项都不抛异常，
      # 只表现为「数据没写进去」或「写到了不该写的行」。抽离时暴露两个既有缺陷：
      #   ① where 条件用 `if (paramData[item])` 真值过滤 → 空串/0 被静默丢弃
      #      → 拼出的 WHERE 少条件 → 本该命中一行的更新变成改写该用户所有会话
      #   ② 字段不在列映射时被静默丢弃 → 调用方无从得知「写入根本没生效」
      - name: 本地 SQLite SQL 构造核心
        run: node scripts/verify/verify_local_db_core.mjs

      # 2026-10-04 新增。前端消息分发条件与后端类型枚举对账：
      # 2026-10-03 曾发生「Chat.vue 分发条件不含 24/25，而 ChatMessageVoice.vue
      # 是从未被 import 的死组件」——服务端正常、历史漫游也拉到，
      # 语音却渲染成普通文本气泡，不抛异常不报错。
      - name: 前端消息分发与后端枚举对账
        run: node scripts/verify/verify_chat_message_dispatch.mjs

      # 2026-10-04 新增。固化前端测试基线：
      # ① vitest 必须钉 1.x（2+/3+/5+ 的 peer 要求 vite 5+，会把 vite 从 4 升上去
      #    从而拖坏 electron-vite@1 —— 实测 vite 必须保持 4.5.14）
      # ② 生产依赖不得混入测试框架 ③ vitest 配置须挂 @vitejs/plugin-vue
      #    （漏掉报 "Install @vitejs/plugin-vue"，vitest 不会自动启用）
      # ④ 全局桩须含 ResizeObserver（缺它组件挂载即崩）
      - name: 前端测试基线契约
        run: node scripts/verify/verify_frontend_test_base.mjs

      # 2026-10-03 新增。csvCell 的「= + - @ 前置单引号」是**安全控制**
      # （聊天内容来自对方，公式注入载荷会在受害者 Excel 中执行）。
      # 原先该逻辑藏在 exportChat.js 的模块私有实现里，而该模块 import electron，
      # node 中无法 import → 零测试。抽离纯核心后才有断言。
      - name: 聊天记录导出纯逻辑核心
        run: node scripts/verify/verify_export_chat_core.mjs

      # 2026-10-04 新增。群聊 @ 提及判定核心：
      # ① filterMembers 必须同时匹配昵称与 userId —— 原先「显示」用
      #    contactName || userId 而「过滤」只用 contactName，未设昵称者
      #    **看得见却搜不到**（两个口径对不上）
      # ② extraData.atAll 必须叠加角色权限 —— 原先条件里没有权限判定，
      #    只挡住面板点击，普通成员**手工键入** @所有人 同样产出 atAll=true，
      #    随后被服务端 checkGroupRole 以 CODE_2305 拒绝 → 整条消息发送失败
      # ③ 组件不得把判定内联回去（抽离白做、缺陷可原地复活）
      - name: 群聊提及判定纯核心
        run: node scripts/verify/verify_at_mention_core.mjs

  # 2026-10-03 新增。AGENTS §6.4 早已点名「verify_schema_drift.mjs 尚未实现」。
  # 该门禁需要活库，故独立成 job（不能塞进 gates —— 那里没有 DB）。
  #
  # 这个 job 的真实价值有两条，都不是「基线 vs 空库」这种无意义的自证：
  #   ① easychat.sql 能否在 **MySQL 8**（CI 版本，与本机 5.7 不同）上干净导入
  #      —— 基线若含 5.7 专有语法，这里就会红；
  #   ② 解析器自检：DROP/CREATE 配对是否全部识别 —— 防止解析器失配后给出「假的全清结论」。
  # 针对「存量库迁移未执行」的漂移检测由 pre-push 与发版前在**真实库**上跑，本 job 不覆盖。
  schema-drift:
    name: 基线与活库表结构对账
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: easychat
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 导入最新基线（模拟一次全新部署）
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot easychat < easychat.sql

      - name: 基线 ⇄ 活库 结构漂移检测
        env:
          SCHEMA_DB_HOST: 127.0.0.1
          SCHEMA_DB_PORT: '3306'
          SCHEMA_DB_USER: root
          SCHEMA_DB_PASSWORD: root
          SCHEMA_DB_NAME: easychat
        run: node scripts/verify/verify_schema_drift.mjs
