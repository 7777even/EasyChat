name: CI

# 与本地 scripts/ 门禁同款，main 推送与 PR 自动执行。
# 与本地 Git hooks 的分工：hooks 管提交与推送前的快速拦截，CI 是权威判定。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端编译与单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-${{ hashFiles('easychat-java/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - name: 安装 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: easychat-java/pom.xml

      - name: mvn test（单测）
        working-directory: easychat-java
        run: mvn -B test

      - name: mvn package（构建产物）
        working-directory: easychat-java
        run: mvn -B package -DskipTests

      - name: 校验构建产物存在
        run: test -f easychat-java/target/easychat-1.0.jar

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: easychat-front/package-lock.json

      - name: npm ci
        working-directory: easychat-front
        run: npm ci

      # 注：此处刻意**不**跑 `npm run lint`。
      # 该脚本在改动前即已失效（`eslint .` 报 "No files matching the pattern"，
      # 显式 glob 则有 311 errors / 20537 warnings 存量），把它设为 CI 闸门会让流水线恒红。
      # 前端 lint 门禁缺失已登记为技术债，见 engineering/retro/2026-10-02-group-join-approval.md
      # 与批次 5 清单。恢复条件见该 retro「改进方案」。

      - name: build
        working-directory: easychat-front
        run: npm run build

  gates:
    name: 契约与规范门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 前后端接口契约一致性
        run: node scripts/check-api-contract.mjs --strict

      - name: IPC 通道注册完整性
        run: node scripts/check-ipc-registration.mjs --strict

      - name: OpenSpec 规格卫生（四件套 / 归档闭环）
        run: node scripts/check-openspec-hygiene.mjs

      - name: Mapper @Param 与 XML 占位符一致性
        run: node scripts/verify/verify_mapper_params.mjs

      - name: 密码明文交接红线
        run: node scripts/verify/verify_password_handoff.mjs

      - name: 运行时配置分层与硬编码凭据
        run: node scripts/verify/verify_no_hardcoded_secret.mjs

      # 2026-10-02 新增。首次运行即抓出位置消息(25)/语音消息(24)端到端未接通：
      # 服务端直推但客户端无 case → 对端实时收不到，且不崩不报错。
      # 详见 scripts/README.md「WS 帧协议对账」。
      - name: WebSocket 帧协议两端对账
        run: node scripts/verify/verify_ws_frame_parity.mjs

      # 2026-10-03 新增。接语音消息时发现 file.js 的 MIME 映射表缺 fileType=3
      # → content-type 拼成 "undefinedwebm"，浏览器无法解码、<audio> 静默无声。
      # 这类缺陷不在 HTTP 请求流里，ws_frame_parity 照不到，属独立一层。
      - name: 本地文件服务器 fileType 与 content-type 一致性
        run: node scripts/verify/verify_file_type_content_type.mjs

      # 2026-10-03 新增。首次运行即抓出三处认证面缺陷：
      # ① 改密 / 找回密码成功后既不清 Token 也不推 FORCE_OFF_LINE（改密无法踢出攻击者）
      # ② 邮箱验证码明文写日志（日志读权限 = 任意账号改密权限）
      # ③ checkRateLimit 在 token 为 null 时直接 return → 四个未登录端点限流形同虚设
      # 这三条都不抛异常、不打警告，属静默失效，故固化为机控断言。
      - name: 密码会话失效与验证码投递契约
        run: node scripts/verify/verify_password_session.mjs

      - name: 虚拟列表核心算法
        run: node scripts/verify/verify_virtual_core.mjs

      - name: 通话核心逻辑
        run: node scripts/verify/verify_call_core.mjs

  # 2026-10-03 新增。AGENTS §6.4 早已点名「verify_schema_drift.mjs 尚未实现」。
  # 该门禁需要活库，故独立成 job（不能塞进 gates —— 那里没有 DB）。
  #
  # 这个 job 的真实价值有两条，都不是「基线 vs 空库」这种无意义的自证：
  #   ① easychat.sql 能否在 **MySQL 8**（CI 版本，与本机 5.7 不同）上干净导入
  #      —— 基线若含 5.7 专有语法，这里就会红；
  #   ② 解析器自检：DROP/CREATE 配对是否全部识别 —— 防止解析器失配后给出「假的全清结论」。
  # 针对「存量库迁移未执行」的漂移检测由 pre-push 与发版前在**真实库**上跑，本 job 不覆盖。
  schema-drift:
    name: 基线与活库表结构对账
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: easychat
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 导入最新基线（模拟一次全新部署）
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot easychat < easychat.sql

      - name: 基线 ⇄ 活库 结构漂移检测
        env:
          SCHEMA_DB_HOST: 127.0.0.1
          SCHEMA_DB_PORT: '3306'
          SCHEMA_DB_USER: root
          SCHEMA_DB_PASSWORD: root
          SCHEMA_DB_NAME: easychat
        run: node scripts/verify/verify_schema_drift.mjs
