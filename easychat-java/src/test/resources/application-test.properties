# 集成测试专用配置（com.easychat.integration 包使用，配套 specs/integration-test）
#
# ⚠ 为何测试不直接用 application.properties 的默认配置：
#   ① 它的 spring.profiles.active=dev 会连带加载 application-dev.properties，
#      那里有**真实库口令**与 test@qq.com 的**真实数据**；
#   ② spring.flyway.enabled 默认 true，会连库执行迁移并写 flyway_schema_history。
#   故测试统一用 @ActiveProfiles("test") 关闭 profile 叠加，并由本文件覆盖关键项。
#   （@ActiveProfiles 会让默认的 active=dev 失效，因此不会加载 application-dev.properties。）

# 关闭 Flyway：测试**绝不**执行迁移，更不能碰真实库的版本表。
spring.flyway.enabled=false

# 数据源指向**不可达**地址（端口 1 = tcpmux，几乎必然 connection refused）。
# HikariCP 是**惰性建连**，本文件配合 initialization-fail-timeout=-1 可保证：
# 「启动期是否有代码去取连接」变成一条**可见的失败信息**，而不是一次静默的真库连接。
# 目的：宁可让测试红，也不让它碰真实库（tasks.md T1 的设计取舍）。
spring.datasource.url=jdbc:mysql://127.0.0.1:1/easychat_should_never_connect
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=2000

# Redis 同理：不因测试而产生任何真实连接。
spring.redis.host=127.0.0.1
spring.redis.port=1

# WebSocket 端口在测试里无意义；显式声明以免将来某个 Bean 误起真实端口。
easychat.ws.port=0

# 日志降噪：启动期的预期失败（如被 mock 的依赖）不应淹没真正的失败。
logging.level.org.springframework.boot.autoconfigure=ERROR