# =====================================================================
# EasyChat 运行时配置 — 公共基线（跨环境一致）
# =====================================================================
# 加载优先级（低 → 高）：
#   本文件  →  application-${spring.profiles.active}.properties  →  系统环境变量
#
# 敏感项一律写成 ${ENV_VAR:默认值} 占位符，禁止裸值。
# 环境专属项（TURN 中继等）不在本文件出现，只放 profile。
# 真实凭据注入方式见仓库根 .env.example。
# =====================================================================

# 默认激活 profile：保证零配置 clone 后 mvn spring-boot:run 可直接起
# 生产/容器用 SPRING_PROFILES_ACTIVE=prod 覆盖
spring.profiles.active=dev

# ======================== 服务端 ========================
server.port=5050
ws.port=5051
server.servlet.context-path=/api
# session 过期时间 60M（一个）
server.servlet.session.timeout=PT60M
# 处理 favicon
spring.mvc.favicon.enable=false
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
# 错误页处理
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ======================== 数据库 ========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/easychat?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=HikariCPDatasource
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# ======================== Redis ========================
# Redis 数据库索引（默认为 0）
spring.redis.database=0
spring.redis.host=${SPRING_REDIS_HOST:127.0.0.1}
spring.redis.port=${SPRING_REDIS_PORT:6379}
# 连接池最大连接数（使用负值表示没有限制）
spring.redis.jedis.pool.max-active=20
# 连接池最大阻塞等待时间（毫秒，使用负值表示没有限制）
spring.redis.jedis.pool.max-wait=-1
# 连接池中的最大空闲连接
spring.redis.jedis.pool.max-idle=10
# 连接池中的最小空闲连接
spring.redis.jedis.pool.min-idle=0
# 连接超时时间（毫秒）
spring.redis.timeout=2000

# ======================== EasyChat 公共配置 ========================
# 文件落盘根目录（同时供 logback-spring.xml 的 ${log.path} 使用）
# 生产务必用 PROJECT_FOLDER 指向持久化卷
project.folder=${PROJECT_FOLDER:c:/easychat/}

# 文件上传配置
easychat.file-upload.max-file-size=15MB
easychat.file-upload.max-request-size=15MB

# 登录策略：false=允许多端同时在线（见 openspec/specs/multi-device-sync）
easychat.login.single-device=false
# 多端模式下同一账号允许的同时在线设备数上限（0=不限制）
easychat.login.max-device-count=0

# 群呼 full-mesh 参与者上限
easychat.call.max-participants=6

# 超级管理员邮箱（多个用户号分隔）—— 生产由 EASYCHAT_ADMIN_EMAILS 注入
easychat.admin-emails=${EASYCHAT_ADMIN_EMAILS:}

# 日志级别配置
log.root.level=info

# 注：easychat.turn.* （TURN 中继）属环境专属项，只存在于 profile 文件。
#     CallService 的 @Value 默认值为空，缺失时降级为纯 STUN，不会启动失败。
