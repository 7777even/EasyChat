# =====================================================================
# EasyChat 运行时配置 — prod profile（生产模板，入库）
# =====================================================================
# 本文件是**模板**：不含任何真实凭据，所有敏感项留空并要求外部注入。
# 启用：export SPRING_PROFILES_ACTIVE=prod
# 注入：见仓库根 .env.example，或部署脚本 export 对应环境变量
#       （或 docker compose --env-file .env up -d）
#
# ⚠️ 本 profile 中「留空」不等于「能跑」：
#    DB 密码无默认可用值，未注入时启动失败属**预期行为**，是刻意设计。
# =====================================================================

# ======================== 数据库 ========================
# 连接地址与库名按部署环境注入：SPRING_DATASOURCE_URL
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# 刻意不提供默认值：生产必须显式注入，缺失即启动失败
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ======================== 文件落盘根目录 ========================
# 必须指向持久化卷，否则容器重建丢文件
project.folder=${PROJECT_FOLDER:/data/}

# ======================== 超级管理员邮箱 ========================
# 由 EASYCHAT_ADMIN_EMAILS 注入，多个用逗号分隔；留空则无超级管理员
easychat.admin-emails=${EASYCHAT_ADMIN_EMAILS:}

# ======================== 邮件服务（邮箱验证码真实投递） ========================
# 2026-10-03 新增。全部留空由外部注入，**无默认可用值**：
# 未注入时 /account/sendEmailCode 走 fail-closed 返回 CODE_1002 拒绝发送
# （绝不退回「把验证码写日志」——日志读权限 = 任意账号改密权限，见 openspec ADR-002）。
# 生产自建 SMTP 后注入以下五个变量即可，无需改动本文件：
#   SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD / SPRING_MAIL_FROM
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.from=${SPRING_MAIL_FROM:}

# ======================== 语音/视频通话 TURN 中继 ========================
# 刻意留空：生产**禁止**沿用任何公共中继（媒体会经第三方服务器）。
# 留空时 CallService 下发的 iceServers 退化为纯 STUN：
#   · 多数家庭/办公 NAT 下通话可用
#   · 对称 NAT 下通话不通（预期降级，非故障）
# 生产自建 coturn 后注入以下三项即可，无需改动本文件：
#   EASYCHAT_TURN_URL / EASYCHAT_TURN_USERNAME / EASYCHAT_TURN_CREDENTIAL
easychat.turn.url=${EASYCHAT_TURN_URL:}
easychat.turn.username=${EASYCHAT_TURN_USERNAME:}
easychat.turn.credential=${EASYCHAT_TURN_CREDENTIAL:}

# 时效凭据的共享密钥（coturn 的 static-auth-secret），**无默认可用值**：
#   与 compose 的 COTURN_STATIC_AUTH_SECRET 必须是同一个值，否则 coturn 拒签、
#   通话在对称 NAT 下不通。
#   支持逗号分隔的**多个**密钥（coturn 官方：Multiple shared secrets can be used），
#   轮换期新旧并存即可**不停机**换密钥。
# ⚠ 一旦实际使用 username/credential 静态三元组，启动日志会打 WARN
#   「正在使用长期静态 TURN 凭据」——那是**有意保留的降级**，不是静默。
easychat.turn.static-secret=${EASYCHAT_TURN_STATIC_SECRET:}

# STUN 地址。**刻意留空**：不再有隐式的公共 STUN 兜底。
#   未配 TURN 时建议显式指定一台自有 STUN；两者都空则启动自检打 WARN。
easychat.turn.stun-url=${EASYCHAT_TURN_STUN_URL:}

# 时效凭据有效期（秒）。默认 3600；置 0 表示不签发时效凭据、回落静态三元组。
# ⚠ 依据 coturn 官方示例 shared_secret_maintainer.pl 的「每小时轮换」单位取 1 小时；
#   coturn 侧对时间戳的容忍窗口官方未给出数值，本值**尚未经真实 coturn 实测**
#   （见 openspec/changes/2026-10-13-turn-deploy-and-key-mgmt 的 QA 未运行项）。
easychat.turn.ttl-seconds=${EASYCHAT_TURN_TTL_SECONDS:3600}
