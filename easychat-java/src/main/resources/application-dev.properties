# =====================================================================
# EasyChat 运行时配置 — dev profile（本地开发 / 本机双实例联调）
# =====================================================================
# 生效方式：默认即 dev（application.properties 中 spring.profiles.active=dev）
# 本文件入库，取值均为**本地开发用**的公开/弱凭据，不含任何生产凭据。
# =====================================================================

# ======================== 数据库 ========================
spring.datasource.username=root
spring.datasource.password=root

# ======================== 文件落盘根目录 ========================
project.folder=c:/easychat/

# ======================== 超级管理员邮箱 ========================
easychat.admin-emails=test@qq.com

# ======================== 邮件服务（邮箱验证码真实投递） ========================
# 2026-10-03 新增（openspec ADR-002）。改造前没有真实投递渠道，
# sendEmailCode 把验证码明文写进应用日志 —— 日志读权限 = 任意账号改密权限。
#
# ⚠️ 下面四项**刻意留空**：留空即 fail-closed，/account/sendEmailCode 返回 CODE_1002
#   并明确拒绝，**不会退回打日志**。这是有意的诚实降级：
#   宁可功能不可用，也不泄露凭据（openspec/design.md ADR-002）。
# 本机要联调找回密码时，把真实 SMTP 值填到仓库根 `.env`（不入库）并用
# `set -a; . ./.env; set +a` 注入以下四个变量，或直接在本文件临时填入后**勿提交**。
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.from=${SPRING_MAIL_FROM:}

# ======================== 语音/视频通话 TURN 中继 ========================
# 公共测试 TURN（anyfirewall guest/guess），仅用于本机双实例联调验证。
# ⚠️ 第三方公共服务器，媒体经其中转；生产环境禁止沿用，
#    请用 application-prod.properties + 自建 coturn 注入。
# 备选公共 TURN：turn:openrelay.metered.ca:80（openrelayproject/openrelayproject）。
easychat.turn.url=turn:turn.anyfirewall.com:443?transport=tcp
easychat.turn.username=guest
easychat.turn.credential=guess

# ⚠ 上面是**长期静态**三元组，故启动自检会打 WARN —— 这是**有意保留**的降级：
#   公共测试中继不提供共享密钥，无法签发时效凭据。本机联调可接受，
#   生产必须改用 application-prod.properties + 自建 coturn + static-secret。
#   配了下面任一项即自动切到时效凭据（并停止告警）：
# easychat.turn.static-secret=${EASYCHAT_TURN_STATIC_SECRET:}
# easychat.turn.ttl-seconds=3600

# ⚠ STUN 同样**刻意不配**：原先前后端各硬编码一份 stun.l.google.com，
#   双份维护必然漂移且依赖境外公共服务；现改为随信令下发。
#   本机联调如需 STUN，显式指定一台（如 stun:stun.l.google.com:19302）。
# easychat.turn.stun-url=
