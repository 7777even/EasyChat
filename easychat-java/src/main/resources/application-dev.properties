# =====================================================================
# EasyChat 运行时配置 — dev profile（本地开发 / 本机双实例联调）
# =====================================================================
# 生效方式：默认即 dev（application.properties 中 spring.profiles.active=dev）
# 本文件入库，取值均为**本地开发用**的公开/弱凭据，不含任何生产凭据。
# =====================================================================

# ======================== 数据库 ========================
spring.datasource.username=root
spring.datasource.password=root

# ======================== 文件落盘根目录 ========================
project.folder=c:/easychat/

# ======================== 超级管理员邮箱 ========================
easychat.admin-emails=test@qq.com

# ======================== 语音/视频通话 TURN 中继 ========================
# 公共测试 TURN（anyfirewall guest/guess），仅用于本机双实例联调验证。
# ⚠️ 第三方公共服务器，媒体经其中转；生产环境禁止沿用，
#    请用 application-prod.properties + 自建 coturn 注入。
# 备选公共 TURN：turn:openrelay.metered.ca:80（openrelayproject/openrelayproject）。
easychat.turn.url=turn:turn.anyfirewall.com:443?transport=tcp
easychat.turn.username=guest
easychat.turn.credential=guess
