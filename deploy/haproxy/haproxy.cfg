# ============================================================
# EasyChat 后端 —— 外部 LB（HAProxy）参考配置
#
# 与 deploy/nginx/nginx-lb.conf.template 等价，**另一种实现**，用来验证
# 「换一种 LB 也不影响跨实例通话」—— 不同实现的粘性策略与超时默认值不同，
# 只验一种不足以说明「外部 LB 形态可用」。
#
# 形态：HTTP 入口 8088（→ 副本 5050/5055），WS 入口 8099（→ 副本 5051/5056）。
#      两个入口都用 **mode tcp 纯透传**（WebSocket 本来就是 TCP 长连接，
#      HAProxy 只需转发字节流，不必理解 HTTP 语义）。
#
# 取证：option tcplog 会把「本次连接落到哪个 server」打进日志，
#      形如 `... ws_lb ws_be/b1 ...` —— 分流是否生效**看日志**而非看脚本记账。
#
# 用法：
#   docker run -d --name easychat-lb-haproxy -p 8088:8088 -p 8099:8099 \
#     -v "$PWD/deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
#     haproxy:alpine
#   docker logs -f easychat-lb-haproxy     # 分流证据
# ============================================================

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode                tcp
    log                 global
    option               tcplog
    timeout connect      5s
    timeout client       60s
    timeout server       60s
    # 长连接（通话/消息 WS）不能被默认 60s 读超时掐断
    timeout tunnel       1h

frontend http_lb
    bind *:8088
    default_backend http_be

backend http_be
    balance roundrobin
    server b1 host.docker.internal:5050
    server b2 host.docker.internal:5055

frontend ws_lb
    bind *:8099
    default_backend ws_be

backend ws_be
    balance roundrobin
    server b1 host.docker.internal:5051
    server b2 host.docker.internal:5056
